name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            suffix: ".exe"
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p tritdb -p tritdb-bench --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tritdb${{ matrix.suffix }}" dist/
          cp "target/${{ matrix.target }}/release/tritdb-bench${{ matrix.suffix }}" dist/
          tar -czf "tritdb-${{ matrix.name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tritdb-${{ matrix.name }}
          path: tritdb-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --generate-notes --title "trit-db $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
