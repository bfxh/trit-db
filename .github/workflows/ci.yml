name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  msrv:
    name: msrv 1.88 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace

  bench-smoke:
    name: bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked --release -p tritdb-bench -- sql-plan --rows 256 --rounds 1 | tee /tmp/sql-plan.txt
      - run: grep -q '"bench_id":"sql_plan"' /tmp/sql-plan.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-join --rows 256 --rounds 1 --strategy auto | tee /tmp/sql-join.txt
      - run: grep -q '"bench_id":"sql_join"' /tmp/sql-join.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-exec --rows 256 --rounds 1 --query filter | tee /tmp/sql-exec.txt
      - run: grep -q '"bench_id":"sql_exec"' /tmp/sql-exec.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-scan --rows 256 --rounds 1 | tee /tmp/bench-sql-scan.txt
      - run: grep -q '"bench_id":"sql_scan"' /tmp/bench-sql-scan.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-point --rows 256 --lookups 16 | tee /tmp/bench-sql-point.txt
      - run: grep -q '"bench_id":"sql_point"' /tmp/bench-sql-point.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-group --rows 256 --groups 8 --rounds 1 | tee /tmp/bench-sql-group.txt
      - run: grep -q '"bench_id":"sql_group"' /tmp/bench-sql-group.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-sort --rows 256 --limit 8 --rounds 1 | tee /tmp/bench-sql-sort.txt
      - run: grep -q '"bench_id":"sql_sort"' /tmp/bench-sql-sort.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-insert --rows 32 --rounds 1 | tee /tmp/bench-sql-insert.txt
      - run: grep -q '"bench_id":"sql_insert"' /tmp/bench-sql-insert.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-update --rows 256 --cutoff 16 --rounds 1 | tee /tmp/bench-sql-update.txt
      - run: grep -q '"bench_id":"sql_update"' /tmp/bench-sql-update.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-delete --rows 256 --cutoff 16 --rounds 1 | tee /tmp/bench-sql-delete.txt
      - run: grep -q '"bench_id":"sql_delete"' /tmp/bench-sql-delete.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-subquery --rows 128 --rounds 1 | tee /tmp/bench-sql-subquery.txt
      - run: grep -q '"bench_id":"sql_subquery"' /tmp/bench-sql-subquery.txt
      - run: cargo run --locked --release -p tritdb-bench -- sql-window --rows 256 --rounds 1 | tee /tmp/bench-sql-window.txt
      - run: grep -q '"bench_id":"sql_window"' /tmp/bench-sql-window.txt
      - run: cargo run --locked --release -p tritdb-bench -- pstore-scan --pages 16 --payload 512 --rounds 1 | tee /tmp/bench-pstore-scan.txt
      - run: grep -q '"bench_id":"pstore_scan"' /tmp/bench-pstore-scan.txt
      - run: cargo run --locked --release -p tritdb-bench -- txn-put --txns 16 --keys-per-txn 2 --rounds 1 | tee /tmp/bench-txn-put.txt
      - run: grep -q '"bench_id":"txn_put"' /tmp/bench-txn-put.txt
      - run: cargo run --locked --release -p tritdb-bench -- pgwire --rows 32 --queries 8 --rounds 1 | tee /tmp/bench-pgwire.txt
      - run: grep -q '"bench_id":"pgwire_roundtrip"' /tmp/bench-pgwire.txt
      - run: cargo run --locked --release -p tritdb-bench -- ann-knn --points 256 --dims 8 --k 5 --rounds 1 | tee /tmp/bench-ann-knn.txt
      - run: grep -q '"bench_id":"ann_knn"' /tmp/bench-ann-knn.txt
      - run: cargo run --locked --release -p tritdb-bench -- graph-reach --nodes 64 --fanout 4 --hops 4 --rounds 1 | tee /tmp/bench-graph-reach.txt
      - run: grep -q '"bench_id":"graph_reach"' /tmp/bench-graph-reach.txt

  bench-regress:
    name: bench regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The committed baseline was recorded on windows-x86_64; shared runners
      # are noisy, so CI only gates order-of-magnitude regressions (>3x).
      - run: cargo run --locked --release -p tritdb-bench -- check --baseline docs/results/bench-baseline.json --tolerance 2.0 --min-ms 0.05

  python-crosscheck:
    name: python crosscheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build --locked -p tritdb
      - run: python tools/crosscheck/gen_vectors.py --check
      - run: python tools/crosscheck/check_cli.py
      - run: python tools/crosscheck/sql_oracle.py --tritdb target/debug/tritdb

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --fail-under-lines 65
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
