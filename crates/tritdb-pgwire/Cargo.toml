[package]
name = "tritdb-pgwire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Minimal PostgreSQL wire protocol server for trit-db"

[dependencies]
tritdb-cas.workspace = true
tritdb-exec.workspace = true
tritdb-sql.workspace = true
base64 = "0.22"
getrandom = "0.3"
md-5 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
x509-parser = { version = "0.18.1", features = ["verify"] }
x509-ocsp = "0.2.1"
der = "0.7"

[dev-dependencies]
rcgen = "0.13"

[lints]
workspace = true
