[workspace]
resolver = "2"
members = [
    "crates/tritdb-radix",
    "crates/tritdb-page",
    "crates/tritdb-format",
    "crates/tritdb-wal",
    "crates/tritdb-txn",
    "crates/tritdb-store",
    "crates/tritdb-exec",
    "crates/tritdb-sql",
    "crates/tritdb-bench",
    "crates/tritdb",
    "crates/tritdb-testkit",
    "crates/tritdb-cas",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfxh/trit-db"

[workspace.dependencies]
tritdb-radix = { path = "crates/tritdb-radix" }
tritdb-page = { path = "crates/tritdb-page" }
tritdb-format = { path = "crates/tritdb-format" }
tritdb-wal = { path = "crates/tritdb-wal" }
tritdb-txn = { path = "crates/tritdb-txn" }
tritdb-store = { path = "crates/tritdb-store" }
tritdb-exec = { path = "crates/tritdb-exec" }
tritdb-sql = { path = "crates/tritdb-sql" }
tritdb-testkit = { path = "crates/tritdb-testkit" }
tritdb-cas = { path = "crates/tritdb-cas" }

[workspace.lints.rust]
unsafe_code = "forbid"
